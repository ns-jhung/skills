### tox configuration ###
[tox]
envlist = py310
requires = tox-conda

[testenv]
passenv = NS_BUILD_DIR

install_command =
    pip install \
    --find-links file://{env:NS_BUILD_DIR}/components/clientstatus/dist \
    {opts} {packages}

conda_env = app-env-py310.yaml
conda_channels=
    conda-forge
